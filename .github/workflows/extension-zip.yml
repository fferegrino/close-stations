name: Package Chrome Extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'extension-v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension service worker
        run: npm run build:extension

      - name: Stage store package
        id: package
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version chrome-extension/manifest.json)
          # Workspace-relative so upload-artifact paths stay simple.
          STAGE="${GITHUB_WORKSPACE}/extension-package"

          rm -rf "$STAGE"
          mkdir -p "$STAGE/icons"

          cp chrome-extension/manifest.json \
            chrome-extension/background.js \
            chrome-extension/content.js \
            chrome-extension/popup.html \
            chrome-extension/popup.js \
            chrome-extension/popup.css \
            "$STAGE/"
          cp chrome-extension/icons/*.png "$STAGE/icons/"

          test -f "$STAGE/manifest.json"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Staged files:"
          find "$STAGE" -type f | sort

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v7
        with:
          # Downloading this artifact yields a zip with manifest.json at the root
          # (do not upload a pre-zipped file — GitHub would nest it).
          name: close-stations-extension-${{ steps.package.outputs.version }}
          path: extension-package/
          if-no-files-found: error
          retention-days: 90
