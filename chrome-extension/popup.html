<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Close Stations</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Close Stations</h1>
      <p id="coords" class="coords">—</p>
      <form id="address-form" class="address-form">
        <label class="address-field">
          <span class="address-field-label">Address</span>
          <input
            id="address-input"
            type="text"
            autocomplete="street-address"
            placeholder="Street, area, or postcode"
            disabled
          />
        </label>
        <div class="address-actions">
          <button type="submit" id="address-apply" disabled>
            Looking up pin address &amp; TfL stations…
          </button>
          <button type="button" id="address-reset" hidden>Use map pin</button>
        </div>
        <p id="address-hint" class="address-hint muted"></p>
      </form>
    </header>

    <main>
      <div id="status" class="status" hidden></div>
      <ul id="stations" class="stations" hidden></ul>
    </main>

    <details class="settings">
      <summary>TfL API key (optional)</summary>
      <p class="muted">Anonymous calls work for light use. A key raises rate limits.</p>
      <label>
        App key
        <input id="tfl-key" type="password" autocomplete="off" placeholder="TFL_APP_KEY" />
      </label>
      <label>
        App id
        <input id="tfl-id" type="text" autocomplete="off" placeholder="optional" />
      </label>
      <button id="save-key" type="button">Save</button>
      <p id="key-saved" class="muted" hidden>Saved.</p>
    </details>

    <script type="module" src="popup.js"></script>
  </body>
</html>
